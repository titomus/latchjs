name: Publish Latch playground
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --no-package-lock --ignore-scripts alpinejs@3.17.5 htmx.org@2.0.11
      - run: npm run build:pages
      - run: python3 scripts/package-downloads.py
      - uses: actions/upload-artifact@v4
        with:
          name: latch-ready-to-use-${{ github.sha }}
          path: |
            _site/dist/latch.js
            _site/dist/latch.min.js
            _site/dist/latch.esm.js
            _site/downloads/latch-latest.zip
            _site/downloads/SHA256SUMS.txt
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
