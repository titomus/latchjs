name: Latch quality gate
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: latch-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --no-package-lock --ignore-scripts alpinejs@3.17.5 htmx.org@2.0.11
      - run: npm run build:pages
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latch-benchmark-samples-${{ github.sha }}
          path: |
            test-results/
            _site/benchmark-metadata.json
          if-no-files-found: ignore
          retention-days: 30
