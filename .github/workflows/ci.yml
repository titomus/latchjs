name: Latch quality gate
on:
  pull_request:
  push:
    branches:
      - fix/runtime-stability-benchmark-20261111
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          mkdir -p _site/dist
          cp docs/index.html _site/index.html
          cp dist/latch.js _site/dist/latch.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
